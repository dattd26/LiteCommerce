name: Build and deploy Docker containers to Azure Web App - dtd-shop & dtd-admin

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # Bước 1: Checkout mã nguồn từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Đăng nhập vào Azure bằng Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Bước 3: Đăng nhập vào Azure Container Registry (ACR)
      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ==========================================
      # BUILD & DEPLOY SHOP APPLICATION
      # ==========================================
      # Bước 4: Build và push Image Shop (sử dụng Dockerfile.shop)
      - name: Build and Push Shop Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.shop
          push: true
          tags: |
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/shop-app:${{ github.sha }}
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/shop-app:latest

      # Bước 5: Deploy Image Shop lên Azure App Service (dtd-shop)
      - name: Deploy Shop to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dtd-shop'
          images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/shop-app:${{ github.sha }}'

      # ==========================================
      # BUILD & DEPLOY ADMIN APPLICATION
      # ==========================================
      # Bước 6: Build và push Image Admin (sử dụng Dockerfile.admin)
      - name: Build and Push Admin Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.admin
          push: true
          tags: |
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/admin-app:${{ github.sha }}
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/admin-app:latest

      # Bước 7: Deploy Image Admin lên Azure App Service (dtd-admin)
      - name: Deploy Admin to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dtd-admin'
          images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/admin-app:${{ github.sha }}'